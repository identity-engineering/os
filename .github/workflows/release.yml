name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle templates into package
        run: |
          mkdir -p ie/templates
          rm -rf ie/templates/personal
          cp -R templates/personal ie/templates/personal

      - name: Install build tooling
        run: pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: List dist
        run: ls -la dist/

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: GitHub Release on os
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      - name: Upload to R2 (org domain)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.CF_R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.CF_R2_SECRET_ACCESS_KEY }}
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pip install awscli
          aws configure set default.s3.addressing_style path
          aws s3 cp dist/ s3://ie-os-releases/releases/ie-os/${VERSION}/ \
            --recursive \
            --endpoint-url https://322d4800eb573fae08729813273419c0.r2.cloudflarestorage.com \
            --no-progress

      - name: Verify public URL
        env:
          VERSION: ${{ steps.ver.outputs.version }}
        run: |
          echo "Artifact URL:"
          echo "  https://identity-engineering.org/releases/ie-os/${VERSION}/ie_os-${VERSION}.tar.gz"
          echo ""
          echo "sha256 for Formula:"
          sha256sum dist/ie_os-${VERSION}.tar.gz | awk '{print $1}'
