name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bundle templates into package
        run: |
          mkdir -p ie/templates
          rm -rf ie/templates/personal
          cp -R templates/personal ie/templates/personal

      - name: Install build tooling
        run: pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - name: List dist
        run: ls -la dist/

      - name: Extract version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: GitHub Release on os
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          fail_on_unmatched_files: true

      # Public install path: identity-engineering.org/releases/ie-os/{version}/
      # Cloudflare R2 (or equivalent) upload — tracked as a dedicated issue; wire secrets here when ready.
      - name: Publish note (org domain)
        run: |
          echo "Built ie-os ${{ steps.ver.outputs.version }}."
          echo "Upload dist/* to https://identity-engineering.org/releases/ie-os/${{ steps.ver.outputs.version }}/"
          echo "Then set sha256 on homebrew-tap Formula/ie-os.rb."
