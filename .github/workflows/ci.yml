name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
    types:
      - checks_requested

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

  package:
    name: package
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install project and build dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Bundle templates
        run: |
          mkdir -p ie/templates
          rm -rf ie/templates/personal
          cp -R templates/personal ie/templates/personal
          rm -rf ie/templates/skills
          cp -R templates/skills ie/templates/skills

      - name: Build distributions
        run: python -m build

      - name: Verify wheel installation
        run: |
          python -m pip install --force-reinstall dist/*.whl
          cd /tmp
          python -c "from ie import __version__; print(__version__)"

      - name: Run install-like Messaging dogfood
        run: |
          IE_BIN="$(command -v ie)" \
            PYTHON_BIN="$(command -v python)" \
            bash scripts/dogfood_messaging.sh