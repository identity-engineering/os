# Preference readout v0
# Identity Engineering OS
#
# Not a store. Preference is the Stem curve in the Now.
# See docs/stem.md (PR #118) and docs/preference.md.
# YAML is documentation. The runtime does not read this file.

schema_version: "0"

purpose: |
  Derived readout of declared Vision Gradient versus revealed slope
  of recent stem_revisions. Spend may later join revealed. Fibers
  are not a prerequisite.

readout_required:
  - identity_id
  - as_of
  - declared
  - revealed
  - sample_count

readout_optional:
  - window
  - divergence
  - tension

rules:
  declared: vision_gradient plus any owner-named direction on stem_state
  revealed: slope of stem_revisions in the window; later plus spend
  divergence: readout / Probe; never auto-writes Stem
  cache_ok: true   # only with as_of; never source of truth
  no_fiber_table: true
  no_path_id_without_aspect: true

privacy:
  default: local_only
  public_card: false
  foreign_read: grant_only
