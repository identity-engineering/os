# Interaction Signal Schema v0
# Identity Engineering OS
#
# Minimal contract for what crosses the boundary at interaction end.
# See docs/interaction-signal.md for full reasoning.

always_required:
  - from                     # sender handle or ephemeral session id
  - to                       # target handle as known in sender's Registry
  - timestamp                # ISO datetime
  - existence                # boolean, always true when signal is sent
  - interaction_depth_delta  # float 0.0–1.0, contribution of this single interaction

always_passed_when_known:
  - sender_emergent_mass     # 0–100 — sender's *computed* emergent self-Mass
                             # (mean of estimates they received). Public geometry.
                             # Not a self-declared rating. Omit only if unobserved.
  - sender_last_mature_at     # ISO datetime of sender's latest committed Mature step
                              # Public freshness metadata only; no Mature content.

consent_based:
  - coarse_mass_estimate     # number 0–100, sender's current estimate of *receiver*
  - mass_confidence          # float 0.0–1.0
  - dimensions_delta         # array of {name, value, confidence}
  - relation_pull            # float 0.0–1.0

meta_optional:
  - schema_version           # "0"
  - transport                # mcp | http | cli | file | a2a | other
  - in_reply_to_request_id   # uuid; links this signal as answer to an inbound estimate request

privacy_defaults:
  share_existence: true
  share_interaction_depth_delta: true
  share_sender_emergent_mass: true     # public gravitational weight of the sender
  share_sender_last_mature_at: true    # public freshness marker, no content
  share_coarse_mass_estimate: false
  share_dimensions_delta: false
  share_relation_pull: false
  share_rich_signals: false

notes:
  - The minimal fields keep volume and interaction tracking alive.
  - sender_emergent_mass is the sender's derived Mass from *their* inbound estimates;
    receivers use it as M_i when computing their own emergent self-Mass (docs/mass.md).
  - Self-Mass is never self-declared; publishing the derived number is allowed.
  - Estimate (what I hold in my Registry) and Signal (what I pass) stay strictly separated.
  - When answering an estimate request, set in_reply_to_request_id for audit linkage.
