# Particle reading v0
# Identity Engineering OS
#
# Not a store. stem_state is x(t). This file only documents optional
# aspect authorship inside substance_json. See docs/stem.md (PR #118)
# and docs/particles.md.
# YAML is documentation. The runtime does not read this file.

schema_version: "0"

purpose: |
  Optional named aspects on an already-persisted Stem snapshot.
  Zero aspects is a valid Particle configuration.

host: stem_state   # the snapshot; not a particles table

aspect_optional_block: stem_state.substance_json.aspects[]

aspect_fields:
  required_if_present: [aspect_id, label, binding]
  optional: [extract_cost_note, formed_from]

binding:
  - confined
  - loose
  - unbound

invariants:
  - Particle is a reading of stem_state, not an Identity
  - aspect creation is Mature only
  - Interact never writes stem_state
  - no separate particles table
  - rebuild-projections is storage recovery, not Time
  - no path_id until an aspect_id exists
