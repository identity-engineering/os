# Identity Surface operations v0
# Logical ops; bindings = MCP tools and/or HTTP routes (see docs/identity-surface.md).

operations:
  receive_interaction_signal:
    type: write_bounded
    description: |
      Accept an IE Interaction Signal and, if policy allows, apply it into the
      callee's foreign-estimate zone. Always returns a receipt.
      Optional in_reply_to_request_id links a reply to an inbound estimate request.
      sender_emergent_mass (when present) is always-passed public geometry.
    request:
      required:
        - from
        - to
        - timestamp
        - existence
        - interaction_depth_delta
      always_passed_when_known:
        - sender_emergent_mass   # sender's computed emergent self-Mass (0–100)
      optional_consent:
        - coarse_mass_estimate
        - mass_confidence
        - dimensions_delta
        - relation_pull
      meta:
        - schema_version
        - transport
        - in_reply_to_request_id
    response_receipt:
      required:
        - receipt_id
        - status
        - timestamp
      optional:
        - applied_fields
        - rejected_fields
        - reason
        - quarantine

  request_estimate:
    type: write_inbox
    description: |
      Land an estimate request in the target Identity's inbound request inbox.
      Never auto-answers.
    request:
      required:
        - requester
        - target
        - timestamp
      optional:
        - requested_fields
        - note
        - request_id
        - schema_version
        - transport
    response:
      - request_id
      - status

  list_inbound_requests:
    type: read_owner
    description: Owner lists pending / historical inbound estimate requests.
    request:
      optional:
        - status

  get_public_card:
    type: read_minimal
    description: |
      Discoverability plus live emergent self-Mass (derived, never self-declared).
      Always readable — gravitational weight of this Identity in the field.
    response:
      - local_handle
      - preferred_name
      - substrate
      - accepts_ie_signals
      - schema_version
      - emergent_self_mass      # number 0–100 or null if unobserved
      - mass_unobserved         # boolean
      - volume_count
      - estimator_count
      - mass_formula_version

  get_receipt:
    type: read
    request:
      - receipt_id
    response:
      - full receipt record if caller is authorized (sender or owner)

  list_grants:
    type: policy_read
    description: Owner or authorized admin lists current grants/scopes.

  revoke_grant:
    type: policy_write_critical
    description: |
      Revoke a grant. Criticality may require human approval depending on policy.

http_binding_sketch:
  base: "/ie/v0"
  post_receive: "/ie/v0/signals"
  post_request: "/ie/v0/requests"
  get_requests: "/ie/v0/requests"
  get_card: "/ie/v0/card"
  get_receipt: "/ie/v0/receipts/{id}"

mcp_binding_sketch:
  tools:
    - name: ie_receive_interaction_signal
      input_schema: request above
    - name: ie_request_estimate
      input_schema: request_estimate.request
    - name: ie_list_inbound_requests
      input_schema: { status: optional string }
    - name: ie_get_public_card
      input_schema: {}
    - name: ie_get_receipt
      input_schema: { receipt_id: string }
