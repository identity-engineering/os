[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ie-os"
version = "0.1.0"
description = "Identity Engineering OS — local-first runtime and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Identity Engineering" }]
dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ie = "ie.cli:app"

[project.urls]
Homepage = "https://identity-engineering.org"
Repository = "https://github.com/identity-engineering/os"
Dist = "https://github.com/identity-engineering/ie-os-dist"

[tool.setuptools.packages.find]
include = ["ie*", "runtime*"]

[tool.setuptools.package-data]
ie = ["py.typed", "templates/**/*"]
