[build-system]
requires = ["setuptools>=68", "setuptools-scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ie-os"
dynamic = ["version"]
description = "Identity Engineering OS — local-first runtime and CLI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Identity Engineering" }]
dependencies = [
  "typer>=0.12",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
mcp = ["mcp>=2.0,<3"]
dev = ["build>=1.2", "pytest>=8.0", "mcp>=2.0,<3"]

[project.scripts]
ie = "ie.cli:app"
ie-mcp = "runtime.mcp_server:main"

[project.urls]
Homepage = "https://identity-engineering.org"
Repository = "https://github.com/identity-engineering/os"
Releases = "https://identity-engineering.org/releases/ie-os/"

[tool.setuptools.packages.find]
include = ["ie*", "runtime*"]

[tool.setuptools.package-data]
ie = ["py.typed", "templates/**/*"]

[tool.setuptools_scm]
fallback_version = "0.0.0.dev0"
version_file = "ie/_version.py"
